flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 24
  adaptive_icon_background: "#2340F5"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"
  adaptive_icon_monochrome: "assets/images/logo_monochrome.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#2340F5"
    theme_color: "#2340F5"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"
